version: 2.1

jobs:
  postcheck_jess-smoke:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Chunk raw buffer
          command: |
            mkdir -p /tmp/pipeline
            set +o pipefail 2>/dev/null; seq 1 1206522 | sha256sum > /tmp/pipeline/summary.out; true
            echo "ready: $(sha256sum /tmp/pipeline/summary.out | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - summary.out
  jess-smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Load previous
          command: |
            stat /tmp/pipeline/summary.out || true
      - run:
          name: Pull sources
          command: git clone --depth 2 --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack bundle
          command: tar -xf core-pkg.tar
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Verify output
          command: cmake --version
      - run:
          no_output_timeout: 80m
          command: /bin/sh -c "./build-run"
  audit_send-it:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Enumerate bucket keys
          command: |
            mkdir -p /tmp/pipeline
            { set +o pipefail 2>/dev/null; ( for i in $(seq 1 41046); do printf "%d\n" $i; done ) | sort -n | tail -1; true ; } > /tmp/pipeline/ckpt-D.pkl
            echo "ready: $(sha256sum /tmp/pipeline/ckpt-D.pkl | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - ckpt-D.pkl
